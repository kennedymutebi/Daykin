
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser theme -->
    <meta name="theme-color" content="#008080" />

    <!-- Page title -->
    <title>Ebiseera — Never Miss a Birthday Wish</title>

    <!-- SEO description -->
    <meta
      name="description"
      content="Ebiseera helps you remember birthdays, celebrate the people who matter, and never miss a special moment."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/jpeg"
      href="/src/assets/daykin.jpeg"
    />

    <!-- Open Graph: Facebook, WhatsApp, LinkedIn -->
    <meta
      property="og:title"
      content="Ebiseera — Never Miss a Birthday Wish"
    />

    <meta
      property="og:description"
      content="Remember birthdays, celebrate the people who matter, and share meaningful moments with Ebiseera."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://ebiseera.com/"
    />

    <meta
      property="og:image"
      content="https://ebiseera.com/src/assets/daykin.jpeg"
    />

    <meta
      property="og:site_name"
      content="Ebiseera"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Ebiseera — Never Miss a Birthday Wish"
    />

    <meta
      name="twitter:description"
      content="Remember birthdays, celebrate the people who matter, and share meaningful moments with Ebiseera."
    />

    <meta
      name="twitter:image"
      content="https://ebiseera.com/src/assets/daykin.jpeg"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://ebiseera.com/"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
